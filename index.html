<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Title -->
        <h1>Hangman Game</h1>

        <!-- 3 Difficulty Levels -->
        <div class="difficulty-container">
            <p>Select Difficulty:</p>
            <button class="level-btn active" data-level="easy">Easy</button>
            <button class="level-btn" data-level="medium">Medium</button>
            <button class="level-btn" data-level="hard">Hard</button>
        </div>

        <!-- Game Info (Level & Lives) -->
        <div class="game-info">
            <p>Level: <span id="current-level">Easy</span></p>
            <p>Lives Left: <span id="lives-count">8</span></p>
        </div>

        <!-- Secret Word (Underscores generated by JS) -->
        <div id="word-display" class="word-display"></div>

        <!-- On-Screen Keyboard (A-Z buttons generated by JS) -->
        <div id="keyboard" class="keyboard"></div>

        <!-- Win/Loss Message -->
        <p id="message" class="message"></p>

        <!-- Restart Button -->
        <button id="reset-btn" class="reset-btn">Play Again</button>
    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
