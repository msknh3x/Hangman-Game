<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hangman Game</title>
  <!-- Link external CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Hangman Game</h1>
   <div class="game-container"></div>
   <div class="difficulty-container"></div>
   <button class="level-btn active" data-level="easy">Easy</button>
   <button class="level-btn" data-level="medium">Medium</button>
   <button class="level-btn" data-level="hard">Hard</button>

<div class="game-info">
    <p>Level: <span id="current-level">Easy</span></p>
    <p>Lives Left: <span id="Lives-count">8</span></p>
</div>

<div id="word-display" class="word-display"></div>
<div id="keyboard" class="keyboard"></div>

  <!-- Link external JavaScript -->
  <script src="script.js"></script>
</body>
</html>
